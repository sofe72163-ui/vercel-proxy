<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vercel Unified App</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #C5A021;
      --text: #f0f0f5;
      --muted: #8e8e93;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    h1 { font-size: 1.3rem; color: var(--accent); font-weight: 600; }
    #status { font-size: 0.85rem; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card h3 { font-size: 0.95rem; margin-bottom: 12px; line-height: 1.4; }
    .card a {
      align-self: flex-start;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      border: 1px solid rgba(197, 160, 33, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>نظام العرض الموحد على Vercel</h1>
      <span id="status">جاري الاتصال بـ /api/feed...</span>
    </header>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    async function loadData() {
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");

      try {
        // لاحظ هنا: مسار نسبي مباشر بدون الحاجة لكتابة الدومين الكامل
        const res = await fetch('/api/feed');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        status.textContent = `تم جلب ${data.count} عنصر عبر Vercel Function`;

        grid.innerHTML = data.items.map(item => `
          <div class="card">
            <h3>${item.title}</h3>
            <a href="${item.url}" target="_blank">رابط المادة &larr;</a>
          </div>
        `).join('');

      } catch (err) {
        status.textContent = "حدث خطأ أثناء الجلب";
        grid.innerHTML = `<p style="color: #ff453a;">تعذر الاتصال بالـ API: ${err.message}</p>`;
      }
    }

    loadData();
  </script>
</body>
</html>
